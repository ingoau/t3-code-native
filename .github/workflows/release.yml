name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          NAME="${TAG#v}"
          # Accept v1.2.3, v1.2.3-beta.4 etc. versionCode = MAJOR*1_000_000 + MINOR*10_000 + PATCH*100 + PRERELEASE_NUMBER.
          if [[ ! "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not semver (expected vMAJOR.MINOR.PATCH[-pre.N])"; exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}; PRE=${BASH_REMATCH[4]}
          if [[ -n "$PRE" ]]; then
            N=$(echo "$PRE" | grep -oE '[0-9]+$' || echo 0)
            (( N > 98 )) && N=98
            EXTRA=$N
            PRERELEASE=true
          else
            EXTRA=99   # a final release sorts after all of its pre-releases
            PRERELEASE=false
          fi
          CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + EXTRA ))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Building $TAG → versionName $NAME, versionCode $CODE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. Releases must be signed with the same key every time so they update in place."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signature and rename
        id: apk
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | tee signing.txt
          if grep -q "CN=Android Debug" signing.txt; then
            echo "::error::APK is debug-signed; check the signing secrets."; exit 1
          fi
          OUT="t3code-android-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: T3 Code for Android ${{ steps.version.outputs.name }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
